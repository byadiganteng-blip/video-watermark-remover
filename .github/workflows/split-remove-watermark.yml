name: Split & Remove Watermark

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL Video (YouTube, Facebook, TikTok, Instagram, atau direct)'
        required: true
        type: string
      part_duration:
        description: 'Durasi per part (detik, default 300 = 5 menit)'
        required: false
        default: '300'
      method:
        description: 'Metode hapus watermark'
        required: false
        default: 'blur'
        type: choice
        options:
          - blur
          - inpaint_fast
          - median
          - inpaint

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1 wget curl
        pip install opencv-python-headless numpy yt-dlp
    
    - name: Verify tools
      run: |
        echo "=== FFmpeg ==="
        ffmpeg -version | head -1
        echo ""
        echo "=== yt-dlp ==="
        yt-dlp --version
    
    - name: Download video
      run: |
        mkdir -p input
        
        echo "=========================================="
        echo "Downloading video..."
        echo "URL: ${{ github.event.inputs.video_url }}"
        echo "=========================================="
        
        python universal_downloader.py \
          --url "${{ github.event.inputs.video_url }}" \
          --output "input/video.mp4"
        
        echo ""
        echo "=== Downloaded file ==="
        ls -lh input/
        
        # Cek video info
        if [ -f "input/video.mp4" ]; then
          echo ""
          echo "=== Video info ==="
          ffprobe -v error -show_entries format=duration,size,format_name \
            -of default=noprint_wrappers=1 input/video.mp4
        fi
    
    - name: Split & Remove Watermark
      run: |
        mkdir -p output
        
        PART_DURATION="${{ github.event.inputs.part_duration || '300' }}"
        METHOD="${{ github.event.inputs.method || 'blur' }}"
        
        echo "=========================================="
        echo "Processing video..."
        echo "Part duration: $PART_DURATION seconds"
        echo "Method: $METHOD"
        echo "=========================================="
        
        python split_remove_watermark.py \
          --input input/video.mp4 \
          --output-dir output \
          --part-duration "$PART_DURATION" \
          --method "$METHOD" \
          --samples 20
        
        echo ""
        echo "=== Output files ==="
        ls -la output/
    
    - name: Upload result
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: video-parts-no-watermark
        path: output/*.mp4
        retention-days: 30
        overwrite: true
        if-no-files-found: warn
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.mp4
        tag_name: parts-${{ github.run_number }}
        name: Split Parts v${{ github.run_number }}
        body: |
          ✅ Video split & watermark removed
          - Source: ${{ github.event.inputs.video_url }}
          - Part duration: ${{ github.event.inputs.part_duration || '300' }}s
          - Method: ${{ github.event.inputs.method || 'blur' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
