name: Split & Remove Watermark

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL video (GitHub release/raw)'
        required: true
        type: string
      part_duration:
        description: 'Durasi per part (detik)'
        required: false
        default: '300'
      method:
        description: 'Metode'
        required: false
        default: 'blur'
        type: choice
        options:
          - blur
          - inpaint_fast
          - median
          - inpaint

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1 wget
        pip install opencv-python-headless numpy
    
    - name: Download video
      run: |
        mkdir -p input
        echo "Downloading: ${{ github.event.inputs.video_url }}"
        wget --timeout=300 "${{ github.event.inputs.video_url }}" -O "input/video.mp4"
        ls -lh input/video.mp4
    
    - name: Split & Remove Watermark
      run: |
        mkdir -p output
        
        PART_DURATION="${{ github.event.inputs.part_duration || '300' }}"
        METHOD="${{ github.event.inputs.method || 'blur' }}"
        
        echo "Part duration: $PART_DURATION seconds"
        echo "Method: $METHOD"
        
        python split_remove_watermark.py \
          --input input/video.mp4 \
          --output-dir output \
          --part-duration "$PART_DURATION" \
          --method "$METHOD" \
          --samples 20
        
        echo "=== Output files ==="
        ls -la output/
    
    - name: Upload result
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: video-parts-no-watermark
        path: output/*.mp4
        retention-days: 30
        overwrite: true
        if-no-files-found: warn
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.mp4
        tag_name: parts-${{ github.run_number }}
        name: Split Parts v${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
